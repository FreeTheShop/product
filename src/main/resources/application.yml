# Safe defaults for every environment. Profiles (dev, prod) and environment variables override.
# Secrets come only from environment variables or files under /run/secrets (configtree); never commit one.
spring:
  application:
    name: product-service
  config:
    import: optional:configtree:/run/secrets/
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/product?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=5000}
  data:
    mongodb:
      auto-index-creation: false   # indexes are created in code (MongoCollectionSetup)

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  server:
    port: 8081            # never expose this port publicly
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,mongo
  otlp:
    metrics:
      export:
        enabled: false     # metrics go to Prometheus (/actuator/prometheus); OTLP is used for traces only
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**

# Outbound resilience. One instance per downstream; add "price" etc. when those calls arrive.
resilience4j:
  circuitbreaker:
    instances:
      identity-jwks:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false     # Identity being down must not mark Product unready
  retry:
    instances:
      identity-jwks:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

product:
  security:
    issuer: ${IDENTITY_ISSUER:http://localhost:9000}
    jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:9000/oauth2/jwks}
    audience: product-service
  http:
    connect-timeout: 1s
    read-timeout: 2s
  cors:
    allowed-origins: []
  rate-limits:
    - name: admin
      path-prefix: /api/v1/admin/
      capacity: 30
      period: 1m
    - name: internal
      path-prefix: /api/v1/internal/
      capacity: 300
      period: 1m
    - name: shop
      method: GET
      path-prefix: /api/v1/products
      capacity: 100
      period: 1m
